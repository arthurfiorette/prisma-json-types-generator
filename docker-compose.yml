# Postgres used by `pnpm test-typedsql`, TypedSQL needs a live database to introspect queries
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: prisma
      POSTGRES_PASSWORD: prisma
      POSTGRES_DB: typedsql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U prisma -d typedsql']
      interval: 2s
      timeout: 5s
      retries: 15
