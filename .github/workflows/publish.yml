name: Publish to NPM

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "NPM tag to publish under"
        required: true
        type: choice
        default: "latest"
        options:
          - latest
          - beta

permissions:
  id-token: write # Required for OIDC
  contents: read

env:
  NPM_PUBLISH_TAG: ${{ inputs.tag || (github.event.release.prerelease && 'beta' || 'latest') }}

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: NPM Registry
      url: https://www.npmjs.com/package/prisma-json-types-generator

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # devEngines.runtime is a range and would resolve to the latest (even prerelease) node
          node-version-file: .nvmrc
          cache: true
          install: true

      - name: Build
        run: pnpm run build

      # Uses OIDC authentication
      - name: Publish to NPM @ ${{ env.NPM_PUBLISH_TAG }}
        run: npx --yes npm@latest publish --access public --tag ${{ env.NPM_PUBLISH_TAG }}
