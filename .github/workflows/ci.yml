name: Code CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Lint
        run: pnpm lint-ci

      - name: Build code
        run: pnpm build

      - name: Unit tests
        run: pnpm test-unit

      - name: E2E tests
        run: pnpm test-e2e

  typedsql:
    name: TypedSQL ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          cache: true
          install: true

      - name: Build code
        run: pnpm build

      # Docker service containers are linux only, this works on every OS
      - name: Setup PostgreSQL
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: prisma
          password: prisma
          database: typedsql

      - name: TypedSQL tests
        run: pnpm test-typedsql
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
