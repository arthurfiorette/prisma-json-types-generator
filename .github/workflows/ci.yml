name: Code CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # devEngines.runtime is a range and would resolve to the latest (even prerelease) node
          node-version-file: .nvmrc
          cache: true
          install: true

      - name: Lint
        run: pnpm lint-ci

      - name: Build code
        run: pnpm build

      - name: Unit tests
        run: pnpm test-unit

      - name: E2E tests
        run: pnpm test-e2e

  typedsql:
    name: TypedSQL ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          # devEngines.runtime is a range and would resolve to the latest (even prerelease) node
          node-version-file: .nvmrc
          cache: true
          install: true

      - name: Build code
        run: pnpm build

      # Docker service containers are linux only, this works on every OS
      - name: Setup PostgreSQL
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@325155bfd7807b2a21ac9c2c7bb9b9a6eacc44df # v9
        with:
          username: prisma
          password: prisma
          database: typedsql

      - name: TypedSQL tests
        run: pnpm test-typedsql
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}
