name: Code CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup node and restore cached dependencies
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint-ci

      - name: Build code
        run: pnpm build

      - name: Unit tests
        run: pnpm test-unit

      - name: E2E tests
        run: pnpm test-e2e
        env:
          # Prisma breaks when running tests in parallel
          PJTG_SEQUENTIAL_TESTS: 1

  e2e-typedsql:
    name: E2E TypedSQL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Uses LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Setup node and restore cached dependencies
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build code
        run: pnpm build

      - name: Start PostgreSQL
        id: postgres
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: prisma
          password: prisma
          database: typedsql_test

      - name: Push database schema
        run: pnpm prisma db push --config test/pg-schemas/prisma.config.ts --schema test/pg-schemas/typedsql.prisma
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

      - name: Generate TypedSQL types
        run: pnpm prisma generate --sql --config test/pg-schemas/prisma.config.ts --schema test/pg-schemas/typedsql.prisma
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.connection-uri }}

      - name: Verify TypedSQL types
        run: pnpm tsd -f test/types/typedsql-pg.test-d.ts -t . --show-diff
